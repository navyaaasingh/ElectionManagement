name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install deps
        working-directory: frontend
        run: npm install

      - name: Build (Vite)
        working-directory: frontend
        env:
          # Required for GitHub Pages subpath hosting.
          BASE_PATH: "/${{ github.event.repository.name }}/"
          # Required for client-side routing on Pages.
          VITE_ROUTER_MODE: "hash"
          # Pages is static; default to relative API paths (no localhost in prod builds).
          # Set this to your deployed backend URL if/when you host the API elsewhere.
          VITE_API_BASE_URL: ""
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

